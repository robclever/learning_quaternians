[package]
name = "learning_quaternians"
version = "0.1.0"
edition = "2021"
description = "Interactive quaternion visualization tool for education"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/robclever/learning_quaternians"

[dependencies]
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web dependencies for WebAssembly compilation
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"

# Web framework for interactive UI
yew = "0.19"

# Serialization for web communication
serde-wasm-bindgen = "0.4"

[dev-dependencies]
criterion = "0.5"

# Benchmarks (uncomment when ready to add benchmarks)
# [[bench]]
# name = "quaternion_benchmarks"
# harness = false

[profile.release]
opt-level = 3
lto = true